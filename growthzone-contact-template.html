<!doctype html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>#GROWTHZONE_HEADING# - Pennsylvania Workforce Development Association</title>

    <!-- ====================================================================
         PA Works — GrowthZone page template: CONTACT US
         --------------------------------------------------------------------
         GrowthZone replaces these tokens at render time:
           #GROWTHZONE_HEADING#  -> the page title
           #growthzone_content#  -> the contact module markup

         Site chrome is NOT in this file:
           header  -> growthzone-custom-header  (global)
           footer  -> growthzone-custom-footer  (global)
           shared CSS (tokens, header, footer, title band, .mn-*)
                   -> growthzone-css            (global)

         The style block below holds only rules unique to this page. It sits
         in the body because GrowthZone keeps only the body of a custom
         template and discards anything placed in the head.
         ==================================================================== -->
</head>

<body>

<style>
/* ==========================================================================
   Contact page — page-specific styles only
   ========================================================================== */

/* Title band image + taller band (layout from .pw-page-head in growthzone-css) */
.pw-page-head {
    min-height: 680px;
    padding: 60px 0 140px;
    background-image: url('https://pawork.org/wp-content/uploads/2026/06/Hand-shake-contact-form.png');
}

/* Form card */
#mn-content .mn-contact-form {
    min-height: 100%;
    background: var(--pw-off-white);
    border: 1px solid var(--pw-light-gray);
    border-radius: var(--pw-radius-lg);
    padding: 32px;
    box-shadow: var(--pw-shadow-sm);
}

/* Two-up field layout inside the form */
#mn-content form {
    display: flex;
    flex-wrap: wrap;
    column-gap: 24px;
    row-gap: 12px;
    align-items: flex-start;
}

#mn-content form .mn-label {
    flex: 1 1 calc(50% - 12px);
    width: auto;
    min-width: 240px;
    margin-bottom: 0;
}

#mn-content form > div,
#mn-content form > .mn-section-head,
#mn-content form > .mn-block,
#mn-content form > h2,
#mn-content form > h3,
#mn-content form .mn-label:has(textarea) { flex: 1 1 100%; }

/* No asterisks on this short form */
#mn-content .mn-required:after { content: none; }

/* Map */
#mn-content .mn-contact-map iframe {
    display: block;
    width: 100%;
    border: 0;
    border-radius: var(--pw-radius-md);
    box-shadow: var(--pw-shadow-sm);
}

/* Contact info card */
#mn-content .mn-contact-info {
    background: var(--pw-gradient-lightblue-navy);
    color: var(--pw-white) !important;
    border-radius: var(--pw-radius-lg);
    padding: 32px;
    box-shadow: var(--pw-shadow-md);
}

/* GrowthZone styles these headings with !important, so match it */
#mn-content .mn-contact-info .mn-section-head { margin-bottom: 16px !important; }

#mn-content .mn-contact-info .mn-section-head,
#mn-content .mn-contact-info .mn-section-head-text {
    font-family: var(--pw-font-heading) !important;
    font-size: 1.25rem !important;
    font-weight: 700 !important;
    text-transform: uppercase !important;
    line-height: 1.3 !important;
    color: var(--pw-white) !important;
}

#mn-content .mn-contact-info .mn-section-body { font-size: 1rem; line-height: 1.7; }

#mn-content .mn-contact-info .mn-street,
#mn-content .mn-contact-info .mn-po-box,
#mn-content .mn-contact-info .mn-city-state-zip,
#mn-content .mn-contact-info .mn-phone { color: var(--pw-white); }

#mn-content .mn-contact-info a { color: var(--pw-gold); font-weight: 600; }
#mn-content .mn-contact-info a:hover { color: var(--pw-white); text-decoration: underline; }

@media (max-width: 768px) {
    .pw-page-head { min-height: auto; padding: 48px 0; }

    #mn-content .mn-contact-form,
    #mn-content .mn-contact-info { padding: 24px; }

    #mn-content form { column-gap: 0; }
    #mn-content form .mn-label { flex: 1 1 100%; min-width: 0; }
    #mn-content .col-sm-7 { flex: 0 0 100%; max-width: 100%; width: 100%; }
}
</style>

<!-- ================= Page title band ================= -->
<div class="pw-page-head">
    <div class="pw-page-head__inner">
        <p class="pw-page-head__label">Reach out</p>
        <h1>#GROWTHZONE_HEADING#</h1>
        <p class="pw-page-head__body">Connect with the Pennsylvania Workforce Development Association (PWDA) and begin driving workforce change.</p>
    </div>
</div>

<!-- ================= GrowthZone content ================= -->
<main class="pw-main" role="main">
    <div class="pw-content">
        #growthzone_content#
    </div>
</main>

</body>
</html>
