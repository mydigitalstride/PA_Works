<!doctype html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Membership - Pennsylvania Workforce Development Association</title>

    <!-- ====================================================================
         PA Works — GrowthZone page template: MEMBERSHIP
         --------------------------------------------------------------------
         GrowthZone replaces these tokens at render time:
           #GROWTHZONE_HEADING#  -> the page title
           #growthzone_content#  -> the membership application markup

         Site chrome is NOT in this file:
           header  -> growthzone-custom-header  (global)
           footer  -> growthzone-custom-footer  (global)
           shared CSS (tokens, header, footer, title band, .mn-*)
                   -> growthzone-css            (global)

         The style block below holds only rules unique to this page. It sits
         in the body because GrowthZone keeps only the body of a custom
         template and discards anything placed in the head.
         ==================================================================== -->
</head>

<body>

<style>
/* ==========================================================================
   Membership page — page-specific styles only
   ========================================================================== */

/* Title band image (layout from .pw-page-head in growthzone-css) */
.pw-page-head {
    background-image: url('https://pawork.org/wp-content/uploads/2026/06/05-02-24-PWDA-40th-Annual-Conference-Day-2-30-2-2048x1363-1.jpg');
}

/* --------------------------------------------------------------------------
   Application layout
   -------------------------------------------------------------------------- */
#mn-content .mn-application { max-width: 900px; margin: 0 auto; }

/* The application stacks its rows; the shared two-column flex row does
   not apply here. */
#mn-content .mn-row { display: block; gap: 0; margin-bottom: 24px; }
#mn-content .mn-col-1 { width: 100%; min-width: 0; }

#mn-content .mn-label { margin-bottom: 0; }
#mn-content .mn-field-name label { margin: 0; font-weight: inherit; }

/* Asterisk goes on the inner label, not the wrapper */
#mn-content .mn-required:after { content: none; }
#mn-content .mn-required label:after { content: ' *'; color: var(--pw-orange); }

/* --------------------------------------------------------------------------
   GrowthZone application panels (#gzns)
   -------------------------------------------------------------------------- */
#mn-content #gzns {
    font-family: var(--pw-font-body);
    font-size: 1rem;
    color: var(--pw-charcoal);
}

#mn-content #gzns .panel.row { margin-left: 0; margin-right: 0; }

#mn-content #gzns .panel {
    background: var(--pw-white);
    border: 1px solid var(--pw-light-gray);
    border-radius: var(--pw-radius-lg);
    box-shadow: var(--pw-shadow-sm);
    margin-bottom: 24px;
    overflow: hidden;
}

#mn-content #gzns .panel-heading {
    background: var(--pw-off-white);
    border-bottom: 1px solid var(--pw-light-gray);
    padding: 18px 24px;
}

#mn-content #gzns .panel-title {
    margin: 0;
    font-family: var(--pw-font-heading);
    font-size: 1.15rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--pw-navy);
}

#mn-content #gzns .panel-body { padding: 24px; display: flow-root; }

#mn-content #gzns > .row.panel {
    margin-top: 0 !important;
    padding: 24px !important;
    text-align: center;
}

#mn-content #gzns .EventRegistration-logo {
    float: none;
    width: 100%;
    max-width: 100%;
    padding: 0;
}

#mn-content #gzns .EventRegistration-logo img { margin: 0 auto; }

#mn-content #gzns .panel-body > .mn-row { padding-bottom: 0; }

#mn-content #gzns .panel-body > .mn-row:not(:has(input[type="radio"])):not(:has(.mn-label)) {
    margin: 0;
    padding: 0;
}

/* Membership-level choices (radio rows) as selectable cards */
#mn-content #gzns .panel-body > .mn-row:has(input[type="radio"]) {
    display: flow-root;
    margin: 0 0 12px;
    padding: 16px 18px;
    background: var(--pw-white);
    border: 1px solid var(--pw-light-gray);
    border-radius: var(--pw-radius-md);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

#mn-content #gzns .panel-body > .mn-row:has(input[type="radio"]):hover {
    border-color: var(--pw-light-blue);
    box-shadow: var(--pw-shadow-sm);
}

#mn-content #gzns .mn-row:has(input[type="radio"]) .col-md-12 {
    float: none;
    width: 100%;
    max-width: 100%;
    padding: 0;
    margin-left: 0 !important;
    left: 0 !important;
}

#mn-content #gzns .mn-row:has(input[type="radio"]) label { margin: 0; }

#mn-content #gzns .mn-row:has(input[type="radio"]) p {
    margin: 10px 0 0;
    color: var(--pw-dark-gray);
    line-height: 1.6;
}

/* Contact-info fields two-up */
#mn-content #gzns .input-contact-info > .mn-row:not(#organization-text-box) {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 24px;
    margin: 0 0 12px;
}

#mn-content #gzns .input-contact-info > .mn-row > [class*="col-sm-"] {
    float: none;
    width: auto;
    max-width: none;
    padding: 0;
    flex: 1 1 calc(50% - 12px);
    min-width: 240px;
}

#mn-content #gzns .input-contact-info > .mn-row > [class*="col-sm-"]:not(:has(.mn-label)) {
    flex: 1 1 100%;
    min-width: 0;
}

#mn-content #gzns .input-contact-info > #organization-text-box > [class*="col-sm-"] {
    float: none;
    width: 100%;
    max-width: 100%;
    padding: 0;
}

#mn-content #gzns .input-contact-info > .col-sm-12 {
    float: none;
    width: 100%;
    max-width: 100%;
    padding: 0;
    margin-bottom: 16px;
}

#mn-content #gzns .input-contact-info > .col-sm-12 > [class*="col-sm-"] {
    float: none;
    width: auto;
    max-width: none;
    padding: 0;
}

/* Select2 dropdowns */
#mn-content #gzns .select2 { margin-left: 0; width: 100% !important; }

#mn-content #gzns .select2-selection {
    min-height: 48px;
    padding: 4px 8px;
    border: 1px solid var(--pw-light-gray);
    border-radius: var(--pw-radius-sm);
}

#mn-content #gzns .alert-danger {
    display: block;
    width: 100%;
    margin: 0;
    padding: 12px 16px;
    background: #fdf2f2;
    border: 1px solid #f3c9c7;
    border-radius: var(--pw-radius-sm);
    color: var(--pw-error);
}

/* GrowthZone styles #gzns buttons with an ID selector, so the shared
   .mn-button rule needs this higher-specificity copy to apply. */
#mn-content #gzns button.mn-button {
    display: inline-block;
    width: auto;
    height: auto;
    padding: 14px 32px;
    font-family: var(--pw-font-heading);
    font-size: 1rem;
    font-weight: 700;
    text-transform: none;
    letter-spacing: 0.3px;
    color: var(--pw-navy);
    background-color: var(--pw-gold);
    background-image: none;
    border: none;
    border-radius: var(--pw-radius-sm);
    box-shadow: none;
    cursor: pointer;
    transition: all 0.3s ease;
}

#mn-content #gzns button.mn-button:hover {
    color: var(--pw-white);
    background-color: var(--pw-navy);
    transform: translateY(-2px);
    box-shadow: var(--pw-shadow-md);
}

@media (max-width: 768px) {
    #mn-content #gzns .panel-heading { padding: 14px 18px; }
    #mn-content #gzns .panel-body { padding: 18px; }
    #mn-content #gzns .input-contact-info > .mn-row { gap: 12px; }
    #mn-content #gzns .input-contact-info > .mn-row > [class*="col-sm-"] {
        flex: 1 1 100%;
        min-width: 0;
    }
    #mn-content #gzns button.mn-button { width: 100%; }
}
</style>

<!-- ================= Page title band ================= -->
<div class="pw-page-head">
    <div class="pw-page-head__inner">
        <p class="pw-page-head__label">Join Today!</p>
        <h1>#GROWTHZONE_HEADING#</h1>
        <p class="pw-page-head__body">Apply to join Pennsylvania Workforce Development Association (PWDA) and start making change in our commonwealth.</p>
    </div>
</div>

<!-- ================= GrowthZone content ================= -->
<main class="pw-main" role="main">
    <div class="pw-content">
        #growthzone_content#
    </div>
</main>

</body>
</html>
