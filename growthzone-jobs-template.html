<!doctype html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Postings - Pennsylvania Workforce Development Association</title>

    <!-- ====================================================================
         PA Works — GrowthZone page template: JOBS
         --------------------------------------------------------------------
         GrowthZone replaces these tokens at render time:
           #GROWTHZONE_HEADING#  -> the page title
           #growthzone_content#  -> the job board module markup

         Site chrome is NOT in this file:
           header  -> growthzone-custom-header  (global)
           footer  -> growthzone-custom-footer  (global)
           shared CSS (tokens, header, footer, title band, .mn-*)
                   -> growthzone-css            (global)

         The style block below holds only rules unique to this page. It sits
         in the body because GrowthZone keeps only the body of a custom
         template and discards anything placed in the head.
         ==================================================================== -->
</head>

<body>

<style>
/* ==========================================================================
   Jobs page — page-specific styles only
   ========================================================================== */

/* Title band image (layout from .pw-page-head in growthzone-css) */
.pw-page-head {
    background-image: url('https://pawork.org/wp-content/uploads/2026/06/istock-2229125295-s3cdn-scaled.webp');
}
</style>

<!-- ================= Page title band ================= -->
<div class="pw-page-head">
    <div class="pw-page-head__inner">
        <p class="pw-page-head__label">Jobs in Pennsylvania</p>
        <h1>#GROWTHZONE_HEADING#</h1>
        <p class="pw-page-head__body">Find and list jobs in Pennsylvania to strengthen our communities.</p>
        <a href="https://members.pawork.org/MIC/login" class="pw-page-head__link">Want to list a job? View Member portal.</a>
    </div>
</div>

<!-- ================= GrowthZone content ================= -->
<main class="pw-main" role="main">
    <div class="pw-content">
        #growthzone_content#
    </div>
</main>

</body>
</html>
